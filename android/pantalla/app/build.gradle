plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fiercewolf.clio.pantalla'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fiercewolf.clio.pantalla'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
