<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Clio</title>
<style>
  :root { --bg:#07090d; --panel:#121823; --line:#222c3c; --text:#eef2f7; --dim:#8692a6; --acc:#3fa9ff; --ok:#3ecf7a; --warn:#ffb340; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui, Roboto, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; padding:20px 24px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  #clock { font-size:96px; font-weight:200; line-height:1; letter-spacing:-2px; }
  #date { color:var(--dim); font-size:22px; margin-top:6px; }
  #link { display:flex; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:16px; color:var(--dim); }
  #link i { margin-right:8px; width:10px; height:10px; border-radius:50%; background:var(--warn); display:inline-block; }
  #link.ok i { background:var(--ok); }
  .grid { flex:1; display:grid; grid-template-columns:repeat(3, 1fr); grid-auto-rows:1fr; gap:14px; margin-top:22px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; justify-content:space-between; color:var(--text); text-decoration:none; position:relative; overflow:hidden; }
  .tile:active { transform:scale(.98); border-color:var(--acc); }
  .tile b { font-size:26px; font-weight:600; }
  .tile small { color:var(--dim); font-size:15px; }
  .tile .ico { font-size:40px; line-height:1; }
  .tile.soon { opacity:.45; }
  .tile.soon::after { content:'Próximamente'; position:absolute; top:14px; right:14px; font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div id="link"><i></i><span>Conectando…</span></div>
  </div>

  <div class="grid">
    <a class="tile" href="cluster.html"><span class="ico">⏱</span><div><b>Cluster</b><br><small>RPM, velocidad, temperatura</small></div></a>
    <div class="tile soon"><span class="ico">♫</span><div><b>Música</b><br><small>Visualizaciones y letras</small></div></div>
    <div class="tile soon"><span class="ico">➤</span><div><b>Mapa</b><br><small>Navegación sin datos</small></div></div>
    <a class="tile" href="/tools/linktest/"><span class="ico">⇄</span><div><b>Prueba de enlace</b><br><small>WiFi, pantalla, teclas</small></div></a>
    <div class="tile shell" id="apps"><span class="ico">▦</span><div><b>Apps del estéreo</b><br><small>Radio, Bluetooth, cámara…</small></div></div>
    <div class="tile shell" id="settings"><span class="ico">⚙</span><div><b>Ajustes</b><br><small>Ajustes de Android</small></div></div>
  </div>

<script>
(function () {
  'use strict';
  var shell = window.ClioShell || null;
  // Fuera de la app (en un navegador normal) no hay acceso a las apps del estéreo
  if (!shell) Array.prototype.forEach.call(document.querySelectorAll('.shell'), function (el) { el.classList.add('hidden'); });
  else {
    document.getElementById('apps').onclick = function () { shell.showApps(); };
    document.getElementById('settings').onclick = function () { shell.settings(); };
  }

  // Reloj
  var clock = document.getElementById('clock'), date = document.getElementById('date');
  function tick() {
    var d = new Date();
    clock.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    try { var t = d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }); date.textContent = t.charAt(0).toUpperCase() + t.slice(1); }
    catch (e) { date.textContent = d.toDateString(); }
  }
  tick(); setInterval(tick, 1000);

  // Estado del enlace con el teléfono (relay del hub)
  var link = document.getElementById('link'), label = link.querySelector('span');
  function setLink(ok, text) { link.className = ok ? 'ok' : ''; label.textContent = text; }
  function connect() {
    var ws;
    try { ws = new WebSocket('ws://' + location.host + '/ws?role=pantalla'); }
    catch (e) { setLink(false, 'Sin conexión'); return setTimeout(connect, 3000); }
    ws.onopen = function () { setLink(true, 'Teléfono conectado'); };
    ws.onmessage = function (e) {
      if (typeof e.data !== 'string') return;
      var m; try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.t === 'hub') {
        var motor = m.clients.some(function (r) { return r.indexOf('motor') === 0; });
        setLink(true, motor ? 'Teléfono conectado · datos del auto' : 'Teléfono conectado');
      }
    };
    ws.onclose = function () { setLink(false, 'Sin conexión'); setTimeout(connect, 3000); };
  }
  connect();
})();
</script>
</body>
</html>
