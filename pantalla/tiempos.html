<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tiempos</title>
<style>
  :root { --bg:#07090d; --panel:#10151e; --panel2:#161d29; --line:#1e2735; --text:#eef2f7; --dim:#8692a6;
    --acc:#ff2d55; --ok:#22c55e; --amber:#f59e0b; --red:#ff3b3b; --blue:#3fa9ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--text); font-family:system-ui, Roboto, sans-serif;
    background:radial-gradient(ellipse at 50% 45%, #121a29 0%, var(--bg) 70%); }
  body { display:flex; flex-direction:column; padding:10px 14px 10px; }
  button { font-family:inherit; color:inherit; }

  .top { display:flex; align-items:center; height:60px; flex-shrink:0; }
  .home { width:58px; height:56px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--text);
    font-size:26px; display:flex; align-items:center; justify-content:center; text-decoration:none; margin-right:14px; }
  .modes { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:4px; }
  .modes button { background:none; border:0; color:var(--dim); font-size:21px; font-weight:700; height:50px; padding:0 22px; border-radius:10px; font-variant-numeric:tabular-nums; }
  .modes button.on { color:#fff; background:var(--acc); box-shadow:0 0 16px rgba(255,45,85,.45); }
  .reset { margin-left:12px; height:58px; padding:0 22px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); font-size:19px; font-weight:600; }
  .reset:active, .modes button:active, .home:active { transform:scale(.96); }
  #clock { margin-left:auto; font-size:26px; font-weight:300; }

  /* estado */
  .state { margin:10px auto 0; height:58px; min-width:520px; padding:0 30px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; letter-spacing:3px; border:2px solid var(--line); color:var(--dim); text-transform:uppercase; }
  .state.wait { color:var(--amber); border-color:rgba(245,158,11,.6); }
  .state.armed { color:#04200f; background:var(--ok); border-color:var(--ok); box-shadow:0 0 30px rgba(34,197,94,.55); animation:pulse 1.1s ease-in-out infinite; }
  .state.run { color:#fff; background:var(--acc); border-color:var(--acc); box-shadow:0 0 30px rgba(255,45,85,.6); }
  .state.done { color:var(--blue); border-color:var(--blue); }
  .state.record { color:#1a1300; background:#facc15; border-color:#facc15; box-shadow:0 0 30px rgba(250,204,21,.6); }
  .state.nodata { color:var(--dim); }
  @keyframes pulse { 50% { box-shadow:0 0 6px rgba(34,197,94,.3); } }

  /* números grandes */
  .nums { flex:1; display:flex; align-items:center; min-height:0; }
  .num { flex:1; text-align:center; }
  .num .v { font-size:190px; font-weight:700; line-height:.95; font-variant-numeric:tabular-nums; letter-spacing:-6px; }
  .num .u { font-size:24px; color:var(--dim); margin-top:4px; letter-spacing:1px; }
  .num.time .v { color:#fff; }
  .num.time.run .v { color:var(--acc); text-shadow:0 0 30px rgba(255,45,85,.35); }
  .num.time.done .v { color:var(--blue); }
  .num.time.record .v { color:#facc15; text-shadow:0 0 30px rgba(250,204,21,.4); }
  .div { width:1px; align-self:stretch; background:linear-gradient(transparent, var(--line), transparent); margin:30px 0; }
  .sub { display:flex; justify-content:center; font-size:20px; color:var(--dim); margin-top:8px; font-variant-numeric:tabular-nums; min-height:30px; }
  .sub span { margin:0 12px; }
  .sub b { color:var(--text); font-weight:600; }
  .delta { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; min-height:44px; margin-top:6px; }
  .delta.faster { color:var(--ok); }
  .delta.slower { color:var(--red); }
  .delta.none { color:var(--dim); font-size:18px; font-weight:400; padding-top:10px; }

  /* abajo */
  .bottom { display:flex; align-items:center; flex-shrink:0; height:58px; border-top:1px solid var(--line); padding-top:8px; }
  .best { font-size:18px; color:var(--dim); margin-right:18px; white-space:nowrap; }
  .best b { color:#facc15; font-size:24px; font-variant-numeric:tabular-nums; margin-left:6px; }
  .hist { display:flex; flex:1; overflow:hidden; }
  .hist span { border:1px solid var(--line); border-radius:9px; padding:5px 10px; margin-right:6px; font-size:16px; font-variant-numeric:tabular-nums; color:var(--text); white-space:nowrap; }
  .hist span small { color:var(--dim); margin-left:4px; font-size:13px; }
  .hist span.rec { border-color:#a38410; }
  .disc { font-size:12.5px; color:#5d6a7e; max-width:250px; text-align:right; line-height:1.3; }

  #wait { position:fixed; top:70px; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:rgba(7,9,13,.86); z-index:5; }
  #wait[hidden] { display:none; }
  #wait .box { text-align:center; max-width:640px; }
  #wait h2 { font-weight:500; margin:0 0 10px; font-size:28px; }
  #wait p { color:var(--dim); font-size:17px; line-height:1.5; margin:0; }
</style>
</head>
<body>
  <div class="top">
    <a class="home" href="./" aria-label="Inicio">⌂</a>
    <div class="modes" id="modes">
      <button data-mode="0-100">0–100</button>
      <button data-mode="0-60">0–60</button>
      <button data-mode="60-100">60–100</button>
      <button data-mode="400m">400 m</button>
    </div>
    <button class="reset" id="btnReset">↺ Reiniciar</button>
    <span id="clock">--:--</span>
  </div>

  <div class="state wait" id="state">Detente para armar</div>

  <div class="nums">
    <div class="num">
      <div class="v" id="speed">0</div>
      <div class="u">km/h</div>
      <div class="sub" id="subL"></div>
    </div>
    <div class="div"></div>
    <div class="num time" id="timeBox">
      <div class="v" id="time">0.00</div>
      <div class="u">segundos</div>
      <div class="delta none" id="delta"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="best" id="best">Mejor <b>—</b></div>
    <div class="hist" id="hist"></div>
    <div class="disc" id="disc">Precisión aprox. ±0.2 s: depende de qué tan seguido responde el OBD.</div>
  </div>

  <div id="wait" hidden>
    <div class="box">
      <h2 id="waitTitle">Esperando datos del auto…</h2>
      <p id="waitText"></p>
    </div>
  </div>

<script type="module" src="tiempos.js"></script>
</body>
</html>
